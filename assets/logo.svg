<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DevLauncher - Novatech Solution">
  <title>DevLauncher - Novatech Solution</title>
  <!-- Bandes aux couleurs du Bénin, comme dans le logo Nova Tech -->
  <rect x="3" y="45" width="18" height="8" rx="1" fill="#00A651"/>
  <rect x="23" y="45" width="18" height="8" rx="1" fill="#F7941D"/>
  <rect x="43" y="45" width="18" height="8" rx="1" fill="#ED1C24"/>
  <!-- Pentagone Nova Tech : la pointe touche la bande centrale -->
  <path d="M23.8 6 H40.2 L52.5 26 L32 43 L11.5 26 Z" fill="#0373BB" stroke="#0373BB" stroke-width="6" stroke-linejoin="round"/>
  <!-- Invite de commande : lancer -->
  <path d="M24 15 L30.5 21.5 L24 28" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M33.5 28 H40.5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
